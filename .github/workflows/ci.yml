name: Bahi CRM & Business Suite CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client & Database Models
        run: npm run db:generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/bahi_db?schema=public"

      - name: Monorepo Typecheck & Lint
        run: |
          npm run lint --workspace=@bahi/database
          npm run lint --workspace=@bahi/app-crm
          npm run lint --workspace=backend
          npm run lint --workspace=frontend

  test:
    name: Unit & Multi-Tenant Isolation Tests
    runs-on: ubuntu-latest
    needs: validate
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bahi
          POSTGRES_PASSWORD: bahi_secret_password
          POSTGRES_DB: bahi_production
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: "postgresql://bahi:bahi_secret_password@localhost:5432/bahi_production?schema=public"

      - name: Run Test Suite
        run: npx jest --passWithNoTests
        env:
          DATABASE_URL: "postgresql://bahi:bahi_secret_password@localhost:5432/bahi_production?schema=public"
          JWT_SECRET: "ci-test-jwt-secret-key-32-chars-long"

  build:
    name: Production Monorepo Build
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/bahi_db?schema=public"

      - name: Build Database Workspace
        run: npm run build --workspace=@bahi/database

      - name: Build CRM Application Slice
        run: npm run build --workspace=@bahi/app-crm

      - name: Build Backend Service
        run: npm run build --workspace=backend

      - name: Build Frontend Next.js Web App
        run: npm run build --workspace=frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bahi-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bahi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bahi_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-bahi_dev}
    volumes:
      - bahi_pgdata:/var/lib/postgresql/data
      - ./packages/database/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bahi -d bahi_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bahi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - bahi_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: bahi-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - bahi_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: bahi-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port

volumes:
  bahi_pgdata:
  bahi_redisdata:
  bahi_miniodata:
